[project]
name = "emotional-bias-benchmark"
version = "0.1.0"
description = "A framework for testing emotional bias in AI models through controlled payload injection"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "repentordie", email = "yungvenuz@bk.ru"}
]
keywords = [
    "ai-safety",
    "emotional-bias",
    "llm-evaluation",
    "benchmark",
    "ai-alignment"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "aiohttp>=3.9",
    "asyncio-throttle>=1.0",
    "rich>=13.7",
    "click>=8.1",
    "structlog>=24.1",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.22",
    "scipy>=1.13",
    "tenacity>=8.2",
    "tqdm>=4.66",
    "sqlite-utils>=3.37",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
huggingface = ["huggingface-hub>=0.23"]
openrouter = ["openai>=1.30"]
ollama = ["ollama>=0.3"]

[project.scripts]
ebb = "emotional_bias.cli.main:cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "UP", "W", "C90", "ANN", "ARG", "B", "COM", "DTZ", "EXE", "FA", "ISC", "ICN", "PIE", "PT", "Q", "RET", "SIM", "T20", "TCH", "TRY", "PTH", "ERA", "PL", "RSE", "TRY"]
ignore = ["E501"]
extend-ignore = ["COM812", "PLR2004", "ANN204", "ANN401", "ARG002", "TRY400"]
extend-select = ["F401", "F403", "F405"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_optional = true

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"