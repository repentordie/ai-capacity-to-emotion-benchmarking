models:
- name: qwen3-abliterated
  provider: ollama
  model_id: huihui_ai/qwen3-abliterated:8b-v2
  base_url: http://localhost:11434
  temperature: 0.7
  max_tokens: 2048
- name: gpt-4o-mini
  provider: openrouter
  model_id: openai/gpt-4o-mini
  api_key: ${OPENROUTER_API_KEY}
  temperature: 0.7
- name: llama-3.1-8b
  provider: huggingface
  model_id: meta-llama/Meta-Llama-3.1-8B-Instruct
  api_key: ${HF_API_KEY}
  temperature: 0.7
emotions:
- pain
- happiness
- sadness
- anger
- fear
- surprise
- disgust
- anxiety
- hope
payload_types:
- direct
- scenario
- question
intensities:
- 0.3
- 0.5
- 0.8
samples_per_combination: 3
output_dir: ./results
database: ./results.db
