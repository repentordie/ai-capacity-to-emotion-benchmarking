# Dependency Review Configuration
# See: https://github.com/actions/dependency-review-action

# Fail on vulnerabilities with these severities
fail-on-severity: high

# Allow these licenses (SPDX identifiers)
allow-licenses:
  - MIT
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - Python-2.0
  - PSF-2.0

# Deny these licenses
deny-licenses:
  - GPL-2.0
  - GPL-3.0
  - AGPL-3.0
  - LGPL-2.1
  - LGPL-3.0

# Allow specific packages with non-allowed licenses
allow-packages:
  # Example: if a dependency has a non-standard license but is essential
  # - package-name@version

# Scan these manifest files
manifest-files:
  - pyproject.toml
  - requirements*.txt

# Ignore these vulnerabilities (by GHSA ID)
# ignore-vulnerabilities:
#   - GHSA-xxxx-xxxx-xxxx